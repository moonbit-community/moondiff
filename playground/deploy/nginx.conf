# 将 diff.example 和证书路径替换为实际值，并设置后端
# MOONDIFF_PUBLIC_URL=https://实际域名；后端不会从代理请求头推断公开地址。
# Replace diff.example and the certificate paths with actual values, and set
# MOONDIFF_PUBLIC_URL=https://your-domain on the backend; it does not infer the public URL from proxy headers.
# 将本文件包含在 Nginx 的 http 上下文中；map 和 limit_req_zone 必须定义在该层级。
# Include this file in the Nginx http context; map and limit_req_zone must be defined at that level.


# -------------------------------------------------------------------------------------------------------------------------------------------------------------------


# 仅对创建会话和发起设备登录的 POST 请求按 IP 限流；其他请求使用空 key，跳过此限流。
# key 使用连接来源 IP 的二进制表示（$binary_remote_addr），不读取 X-Forwarded-For。
# Generate per-IP rate-limit keys only for POST requests that create sessions or start device login.
# Other requests use an empty key and bypass this rate limit.
# The key uses the connecting IP in binary form ($binary_remote_addr), never X-Forwarded-For.
map "$request_method:$uri" $moondiff_auth_limit_key {
    default "";
    "POST:/api/auth/session" $binary_remote_addr;
    "POST:/api/auth/device/start" $binary_remote_addr;
}

# 两个接口共享每个 IP 的限流额度，长期平均每分钟 2 次；10m 是保存限流状态的共享内存大小。
# Both endpoints share each IP's rate limit of 2 requests per minute on average.
# The 10m zone reserves 10 MiB of shared memory for rate-limit state.
limit_req_zone $moondiff_auth_limit_key zone=moondiff_auth:10m rate=2r/m;

server {
    # 后端只提供 HTTP，由 Nginx 在标准 HTTPS 端口终止 TLS，保护登录和会话数据。
    # The backend serves HTTP only; Nginx terminates TLS on the standard HTTPS port to protect login and session data.
    listen 443 ssl;
    # 用公开域名匹配虚拟主机，证书也必须覆盖该域名。
    # Match the virtual host using the public domain name, which must also be covered by the certificate.
    server_name diff.example;
    # fullchain 包含站点证书和中间证书，供客户端验证完整的证书链。
    # fullchain includes the site certificate and intermediate certificates so clients can verify the full certificate chain.
    ssl_certificate /etc/letsencrypt/live/diff.example/fullchain.pem;
    # 使用与证书匹配的私钥完成 TLS 握手；此路径采用 Let's Encrypt 的目录约定。
    # Use the matching private key for the TLS handshake; this path follows the Let's Encrypt directory convention.
    ssl_certificate_key /etc/letsencrypt/live/diff.example/privkey.pem;

    # 后端 JS 使用 text/javascript；同时压缩 CSS 和 SVG，并标记编码协商。
    # The backend serves JS as text/javascript; also compress CSS and SVG and vary by encoding.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/javascript application/javascript text/css image/svg+xml;

    # 与后端 RPC 的 128 KiB 请求体上限一致，在代理层提前以 413 拒绝超大请求。
    # Match the backend RPC request body limit of 128 KiB and reject oversized requests early at the proxy with HTTP 413.
    client_max_body_size 128k;
    # 浏览器收到后一年内使用 HTTPS 访问此域名，避免后续访问降级到 HTTP；
    # always 让错误响应也携带 HSTS。未设置 includeSubDomains，因此不影响子域名。
    # Tell browsers to use HTTPS for this domain for one year after receiving this header, preventing subsequent HTTP downgrades.
    # always adds HSTS to error responses too. includeSubDomains is omitted, so subdomains are unaffected.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 对上方 map 选中的请求应用限流：允许额外突发 10 次且不排队等待，超出额度返回 HTTP 429。
    # 后端 SQLite 的会话数量上限独立生效。
    # Apply the limit to requests selected by the map above: allow 10 excess requests without delay.
    # Reject requests exceeding the burst allowance with HTTP 429.
    # The backend's SQLite session cap remains effective independently of Nginx.
    limit_req zone=moondiff_auth burst=10 nodelay;
    limit_req_status 429;

    # 应用部署在根路径，静态资源、页面路由、/api 和 /auth 都交由后端处理；
    # 后端负责判断哪些路径返回应用入口，统一改写到 index.html 会掩盖 API 和 404 响应。
    # The app is deployed at the root path; the backend handles static assets, page routes, /api, and /auth.
    # The backend decides which paths serve the app entry point; rewriting everything to index.html would mask API and 404 responses.
    location / {
        # Nginx 与后端部署在同一宿主机，通过回环地址转发 HTTP。
        # 后端应监听 127.0.0.1:4173，或由 Docker 将容器端口发布到该回环地址，
        # 避免客户端绕过代理直接访问。proxy_pass 不带 URI，保留原请求路径和查询参数。
        # Nginx and the backend run on the same host, forwarding HTTP over the loopback address.
        # Bind the backend to 127.0.0.1:4173, or have Docker publish the container port on that loopback address,
        # to prevent clients from bypassing the proxy. proxy_pass has no URI, preserving the original request path and query parameters.
        proxy_pass http://127.0.0.1:4173;
        # 明确上游使用 HTTP/1.1，使不同 Nginx 版本的默认值不影响代理协议。
        # Explicitly use HTTP/1.1 upstream so defaults across Nginx versions do not affect the proxy protocol version.
        proxy_http_version 1.1;
        # 保留请求的域名，避免上游收到默认的代理目标地址 127.0.0.1:4173。
        # Preserve the request domain name instead of sending the default proxy target address, 127.0.0.1:4173, upstream.
        proxy_set_header Host $host;
        # 此入口只接受 HTTPS；即使代理到后端使用 HTTP，也传递客户端使用的协议。
        # 该请求头不能替代上方的 MOONDIFF_PUBLIC_URL 配置。
        # This endpoint accepts HTTPS only; pass the client's protocol even though the connection to the backend uses HTTP.
        # This header does not replace the MOONDIFF_PUBLIC_URL setting above.
        proxy_set_header X-Forwarded-Proto https;
        # 在已有转发链后追加连接来源地址，向上游传递访问来源信息。
        # Append the connecting client's address to the existing forwarding chain to pass request origin information upstream.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端处理请求的超时为 60 秒（backend/server.mbt），额外留出 10 秒返回错误响应，
        # 避免 Nginx 先超时；这里限制的是读取上游响应时的连续无数据时间。
        # The backend request timeout is 60 seconds (backend/server.mbt); allow 10 extra seconds for an error response
        # so Nginx does not time out first. This limits the idle interval between reads of the upstream response.
        proxy_read_timeout 70s;
    }
}
