name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          MOON_WORK=off moon update
          moon -C review-web update

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: review-web/package-lock.json

      - name: Check workspace dependency policy
        run: node scripts/check-workspace.mjs

      - name: moon check
        run: |
          MOON_WORK=off moon check --target all
          moon -C review-web check protocol --target all --deny-warn
          moon -C review-web/frontend check --target js --deny-warn
          moon -C review-web/backend check --target wasm --deny-warn
      
      - name: format diff
        run: |
          node scripts/fmt.mjs
          git diff --exit-code

      - name: info check
        run: |
          MOON_WORK=off moon info
          moon -C review-web info protocol --target all
          moon -C review-web/frontend info --target js
          moon -C review-web/backend info --target wasm
          git diff --exit-code
      
      - name: run test
        run: |
          MOON_WORK=off moon test --target all
          moon -C review-web test protocol --target all
          moon -C review-web/frontend test --target js
          moon -C review-web/backend test
          bash scripts/cli_test.sh && git diff --exit-code cli_test

      - name: Install review app dependencies
        working-directory: review-web
        run: npm ci

      - name: Build release artifacts
        run: npm run build

      - name: Run release artifact tests
        run: npm run test:artifacts

      - name: Run review app integration tests
        run: npm run test:server

      - name: Run extension unit tests
        run: npm run test:extension:unit

      - name: Run E2E configuration tests
        working-directory: review-web
        run: npm run test:e2e-config
