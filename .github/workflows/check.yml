name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: moon check
        run: |
          moon check --target all
          moon check playground/protocol --target all --deny-warn
          (cd playground/frontend && moon check --target js --deny-warn)
          (cd playground/backend && moon check --target wasm --deny-warn)
      
      - name: format diff
        run: |
          moon fmt
          (cd playground/frontend && moon fmt)
          (cd playground/backend && moon fmt)
          git diff --exit-code

      - name: info check
        run: |
          moon info
          (cd playground/frontend && moon info --target js)
          (cd playground/backend && moon info --target wasm)
          git diff --exit-code
      
      - name: run test
        run: |
          moon test --target all
          (cd playground/frontend && moon test --target js)
          (cd playground/backend && moon test)
          bash scripts/cli_test.sh && git diff --exit-code cli_test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install playground dependencies
        working-directory: playground
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: playground
        run: npx playwright install --with-deps chromium

      - name: Run playground integration tests
        run: node --test playground/backend/tests/server.test.mjs

      - name: Run extension tests
        run: npm run test:extension

      - name: Run Playwright integration tests
        working-directory: playground
        run: npm run test:e2e

      - name: Upload browser test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playground/test-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
