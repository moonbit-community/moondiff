name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: moon check
        run: |
          moon check --target all
          moon check review-web/protocol --target all --deny-warn
          (cd review-web/frontend && moon check --target js --deny-warn)
          (cd review-web/backend && moon check --target wasm --deny-warn)
      
      - name: format diff
        run: |
          moon fmt
          (cd review-web/frontend && moon fmt)
          (cd review-web/backend && moon fmt)
          git diff --exit-code

      - name: info check
        run: |
          moon info
          (cd review-web/frontend && moon info --target js)
          (cd review-web/backend && moon info --target wasm)
          git diff --exit-code
      
      - name: run test
        run: |
          moon test --target all
          (cd review-web/frontend && moon test --target js)
          (cd review-web/backend && moon test)
          bash scripts/cli_test.sh && git diff --exit-code cli_test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: review-web/package-lock.json

      - name: Install review app dependencies
        working-directory: review-web
        run: npm ci

      - name: Build release artifacts
        run: npm run build

      - name: Run release artifact tests
        run: npm run test:artifacts

      - name: Install Playwright browsers
        working-directory: review-web
        run: npx playwright install --with-deps chromium firefox

      - name: Run review app integration tests
        run: npm run test:server

      - name: Run extension tests
        run: npm run test:extension

      - name: Run browser component and integration tests
        working-directory: review-web
        run: npm run test:e2e

      - name: Upload browser test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-web/test-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  rendering-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: moon update

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: review-web/package-lock.json

      - name: Install review app dependencies
        working-directory: review-web
        run: npm ci

      - name: Install Chromium
        working-directory: review-web
        run: npx playwright install --with-deps chromium

      - name: Run rendering stress tests
        run: npm run test:review-web:stress

      - name: Upload rendering stress test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendering-stress-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-web/test-results/
          retention-days: 7
          if-no-files-found: ignore
