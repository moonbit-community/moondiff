name: publish-package

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    # This template publishes the MoonBit module at the repository root.
    # Use macos-latest or windows-latest if you want to publish to those platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Publish the root module standalone; moon.work would otherwise pull in
      # the playground modules.
      MOON_WORK: "off"
    outputs:
      published_tag: ${{ steps.prepublish.outputs.published_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-ubuntu
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: prepublish check
        id: prepublish
        run: |
          moon fmt
          git diff --exit-code
          moon check
          moon test
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          if [[ -z "$version" ]]; then
            echo "could not read package version from moon.mod" >&2
            exit 1
          fi
          echo "published_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBIT_COMMUNITY_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ needs.publish.outputs.published_tag }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$PUBLISHED_TAG" \
            -f sha="$GITHUB_SHA"
