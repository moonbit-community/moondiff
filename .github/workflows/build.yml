name: build

on:
  workflow_dispatch:

run-name: build wasm from ${{ github.sha }}

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: moon check
        run: |
          # temporarily fix this
          moon check || cp .mooncakes parser -r
          moon check --target wasm

      - name: build wasm
        run: moon build --target wasm --release

      - name: prepare asset
        run: |
          set -euo pipefail

          wasm_path="_build/wasm/release/build/moonbit-community/moondiff/moondiff/moondiff.wasm"

          test -f "$wasm_path"
          mkdir -p dist
          cp "$wasm_path" dist/moondiff.wasm

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="build-${GITHUB_SHA::7}"

          gh release view "$release_tag" >/dev/null 2>&1 || \
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --notes "Built from commit $GITHUB_SHA"

          gh release upload "$release_tag" dist/moondiff.wasm --clobber
